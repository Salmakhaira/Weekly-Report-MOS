<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Data · Weekly Report MOS</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="shell"></div>

<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Input Data</p>
    <h1>Isi laporan cabang</h1>
    <p>Klik nama salesman untuk membuka isiannya. Hanya satu yang terbuka pada satu waktu, supaya tidak salah taruh angka.</p>
  </div>

  <div class="toolbar">
    <div class="field">
      <label>Tahun</label>
      <details class="filterdrop" id="dd-year">
        <summary><span class="fdlabel" id="lbl-year"></span></summary>
        <div class="fdpanel" id="panel-year"></div>
      </details>
    </div>
    <div class="field">
      <label>Bulan</label>
      <details class="filterdrop" id="dd-month">
        <summary><span class="fdlabel" id="lbl-month"></span></summary>
        <div class="fdpanel" id="panel-month"></div>
      </details>
    </div>
    <div class="field">
      <label>Minggu berjalan</label>
      <div class="weekpick" id="f-week" role="group" aria-label="Pilih minggu"></div>
    </div>
    <div class="field grow">
      <label for="f-branch">Cabang</label>
      <select id="f-branch"></select>
    </div>
  </div>

  <div id="note" class="note"></div>

  <div id="periodchips" class="periodchips"></div>

  <div id="periodband" class="periodband"></div>

  <div id="acctable" class="acctable">
    <div class="skeleton">Memuat data…</div>
  </div>
</main>

<script type="module" src="assets/input.js"></script>
</body>
</html>
